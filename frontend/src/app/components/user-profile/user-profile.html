<div class="container mt-4" *ngIf="user">
      <h2>My Profile</h2>
      <form (ngSubmit)="updateProfile()" #profileForm="ngForm">

        <div class="mb-3">
          <label class="form-label">First Name</label>
          <input type="text" class="form-control" [(ngModel)]="user.firstname" name="firstname" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-control" [(ngModel)]="user.lastname" name="lastname">
        </div>
        <div class="mb-3">
           <label class="form-label">Phone Number</label>
           <input type="text"class="form-control"[(ngModel)]="user.phonenumber"name="phonenumber">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="user.email" name="email" required readonly>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!profileForm.form.valid">
          Update Profile
        </button>
      </form>
    </div>
