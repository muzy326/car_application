<div class="booking-panel">

  <div class="booking-panel-header">
    <div class="bp-icon"><i class="bi bi-calendar-check-fill"></i></div>
    <div>
      <h5>Book This Car</h5>
      <p>Select your rental dates</p>
    </div>
  </div>

  <form [formGroup]="bookingForm" (ngSubmit)="submitBooking()">

    <!-- Date grid -->
    <div class="date-grid">

      <!-- Start Date -->
      <div class="date-field">
        <label class="date-label">
          <i class="bi bi-calendar-event me-2"></i>Pick-up Date
        </label>
        <input
          type="date"
          class="date-input"
          formControlName="startDate"
          [class.date-error]="submitted && bookingForm.controls['startDate'].invalid"
        />
        <div *ngIf="submitted && bookingForm.controls['startDate'].invalid" class="date-error-msg">
          Start date is required
        </div>
      </div>

      <!-- End Date -->
      <div class="date-field">
        <label class="date-label">
          <i class="bi bi-calendar-x me-2"></i>Return Date
        </label>
        <input
          type="date"
          class="date-input"
          formControlName="endDate"
          [class.date-error]="submitted && bookingForm.controls['endDate'].invalid"
        />
        <div *ngIf="submitted && bookingForm.controls['endDate'].invalid" class="date-error-msg">
          End date is required
        </div>
      </div>

    </div>

    <!-- Price preview -->
    <div class="price-preview" *ngIf="car">
      <div class="pp-row">
        <span><i class="bi bi-currency-dollar me-1"></i>Daily Rate</span>
        <span class="pp-val">${{ car.price }}/day</span>
      </div>
      <div class="pp-row" *ngIf="car.discount && car.discount > 0">
        <span><i class="bi bi-tag me-1"></i>Discount</span>
        <span class="pp-val pp-discount">-{{ car.discount }}%</span>
      </div>
      <div class="pp-divider"></div>
      <div class="pp-row pp-total">
        <span>Estimated Total</span>
        <span class="pp-total-val">${{ car.price }}</span>
      </div>
    </div>

    <!-- Availability warning -->
    <div *ngIf="car && !car.available" class="avail-warning">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      This car is currently unavailable for booking.
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="btn-book-submit"
      [disabled]="loading || bookingForm.invalid || (car && !car.available)"
    >
      <span *ngIf="!loading">
        <i class="bi bi-lightning-charge-fill me-2"></i>Book Now
      </span>
      <span *ngIf="loading" class="d-flex align-items-center justify-content-center gap-2">
        <span class="spinner-border spinner-border-sm"></span>Processing...
      </span>
    </button>

    <!-- Info chips -->
    <div class="booking-info-chips">
      <div class="info-chip"><i class="bi bi-shield-check"></i>Secure payment</div>
      <div class="info-chip"><i class="bi bi-arrow-counterclockwise"></i>Free cancellation</div>
    </div>

  </form>
</div>
