<div class="container mt-4">

  <div class="card shadow p-3">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Booking Management</h4>
      <div>
        <a routerLink="/dashboard" class="btn btn-outline-secondary me-2">Back</a>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookingModal" (click)="resetForm(bookingForm)">
          + New Booking
        </button>
      </div>
    </div>

    <!-- SEARCH -->
    <input type="text" class="form-control mb-3" placeholder="Search by User ID, Car ID or Status..."
           [(ngModel)]="searchTerm" (input)="applyFilter()">

    <!-- LOADING -->
    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border"></div>
    </div>

    <!-- TABLE -->
    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-hover table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>User</th>
            <th>Car</th>
            <th>Start</th>
            <th>End</th>
            <th>Status</th>
            <th width="250">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let b of pagedBookings">
            <td>{{ b.id }}</td>
            <td>{{ b.userId }}</td>
            <td>{{ b.carId }}</td>
            <td>{{ b.startDate | date:'mediumDate' }}</td>
            <td>{{ b.endDate | date:'mediumDate' }}</td>
            <td><span class="badge" [ngClass]="getStatusBadge(b.status)">{{ b.status }}</span></td>
            <td>
              <button class="btn btn-success btn-sm me-1" *ngIf="b.status !== 'Confirmed'" (click)="updateStatus(b.id!, 'Confirmed')">Confirm</button>
              <button class="btn btn-warning btn-sm me-1" *ngIf="b.status !== 'Cancelled'" (click)="updateStatus(b.id!, 'Cancelled')">Cancel</button>
              <button class="btn btn-primary btn-sm me-1" data-bs-toggle="modal" data-bs-target="#bookingModal" (click)="editBooking(b)">Edit</button>
              <button class="btn btn-danger btn-sm" (click)="deleteBooking(b.id!)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="pagedBookings.length === 0">
            <td colspan="7" class="text-center text-muted py-3">No bookings found</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- PAGINATION -->
    <nav *ngIf="totalPages > 1">
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="goToPage(currentPage - 1)">Prev</button>
        </li>
        <li class="page-item" *ngFor="let p of pages" [class.active]="currentPage === p">
          <button class="page-link" (click)="goToPage(p)">{{ p }}</button>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="goToPage(currentPage + 1)">Next</button>
        </li>
      </ul>
    </nav>

  </div>

  <!-- MODAL -->
  <div class="modal fade" id="bookingModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5>{{ editingBookingId ? 'Edit Booking' : 'New Booking' }}</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <form #bookingForm="ngForm" (ngSubmit)="saveBooking(bookingForm)">
          <div class="modal-body">

            <input type="number" name="userId" class="form-control mb-2" placeholder="User ID"
                   [(ngModel)]="bookingModel.userId" required #userId="ngModel">
            <small class="text-danger" *ngIf="userId.invalid && userId.touched">Required</small>

            <input type="number" name="carId" class="form-control mb-2" placeholder="Car ID"
                   [(ngModel)]="bookingModel.carId" required #carId="ngModel">
            <small class="text-danger" *ngIf="carId.invalid && carId.touched">Required</small>

            <input type="date" name="startDate" class="form-control mb-2"
                   [(ngModel)]="bookingModel.startDate" required #startDate="ngModel">

            <input type="date" name="endDate" class="form-control mb-2"
                   [(ngModel)]="bookingModel.endDate" required #endDate="ngModel">

            <select class="form-select" name="status" [(ngModel)]="bookingModel.status">
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Cancelled">Cancelled</option>
            </select>

          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button class="btn btn-primary" [disabled]="bookingForm.invalid">{{ editingBookingId ? 'Update' : 'Create' }}</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</div>
