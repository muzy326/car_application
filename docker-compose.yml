services:

  db:
    image: postgres:15
    container_name: car_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mujeeba123@
      POSTGRES_DB: car_application
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    container_name: car_backend
    restart: always
    command: node index.js
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: Mujeeba123@
      DB_NAME: car_application
      DB_PORT: 5432
      JWT_SECRET: super_secure_secret_key_for_car_app_12345
      FRONTEND_URL: http://13.53.98.220   # 🔥 CHANGE THIS (your EC2 IP)
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: