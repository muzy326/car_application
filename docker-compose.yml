version: "3.9"

services:

  db:
    image: postgres:17
    container_name: mujeeba_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Mujeeba123@"
      POSTGRES_DB: car_application
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./server
    container_name: mujeeba_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: "Mujeeba123@"
      DB_NAME: car_application
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: mujeeba_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: