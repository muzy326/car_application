<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">

    <!-- Brand -->
    <a class="navbar-brand" routerLink="/home" (click)="closeMenus()">Rent A Car</a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" (click)="toggleCollapse()" [attr.aria-expanded]="!isCollapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [ngClass]="{ 'show': !isCollapsed }">
      <ul class="navbar-nav ms-auto">

        <!-- Home -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active" (click)="closeMenus()">Home</a>
        </li>

        <!-- Cars -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/cars" routerLinkActive="active" (click)="closeMenus()">Cars</a>
        </li>

        <!-- Admin Dropdown -->
        <li class="nav-item dropdown" *ngIf="displayName && isAdmin">
          <a class="nav-link dropdown-toggle" role="button" (click)="toggleAdminDropdown()">Admin</a>
          <ul class="dropdown-menu dropdown-menu-dark" [ngClass]="{ 'show': adminDropdownOpen }">
            <li><a class="dropdown-item" routerLink="/admin" (click)="closeMenus()">Dashboard</a></li>
            <li><a class="dropdown-item" routerLink="/admin/cars" (click)="closeMenus()">Car Management</a></li>
            <li><a class="dropdown-item" routerLink="/admin/bookings" (click)="closeMenus()">Booking Management</a></li>
            <li><a class="dropdown-item" routerLink="/admin/users" (click)="closeMenus()">Users Management</a></li>
          </ul>
        </li>

        <!-- User Dropdown -->
        <li class="nav-item dropdown" *ngIf="displayName">
          <a class="nav-link dropdown-toggle" role="button" (click)="toggleUserDropdown()">{{ displayName }}</a>
          <ul class="dropdown-menu dropdown-menu-dark" [ngClass]="{ 'show': userDropdownOpen }">

            <li><a class="dropdown-item" routerLink="/home" (click)="closeMenus()">Home</a></li>
            <li><a class="dropdown-item" routerLink="/cars" (click)="closeMenus()">All Cars</a></li>

            <!-- Booking Bill (only if latest booking exists) -->
            <li>
              <a class="dropdown-item" (click)="goToLatestBill(); closeMenus()" >Booking Bill</a>
            </li>

            <li><a class="dropdown-item" routerLink="/my-bookings" (click)="closeMenus()">My Bookings</a></li>

            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
          </ul>
        </li>

        <!-- Login -->
        <li class="nav-item" *ngIf="!displayName">
          <a class="nav-link" routerLink="/login" (click)="closeMenus()">Login</a>
        </li>

      </ul>
    </div>

  </div>
</nav>
