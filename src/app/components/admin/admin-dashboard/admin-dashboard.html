<div class="container mt-4">

  <h3 class="mb-4">Admin Dashboard</h3>

  <!-- Action Buttons -->
  <div class="mb-3">
    <a routerLink="/admin/cars" class="btn btn-primary me-2">Manage Cars</a>
    <a routerLink="/admin/users" class="btn btn-secondary me-2">Manage Users</a>
    <a routerLink="/admin/bookings" class="btn btn-success me-2">View Bookings</a>
    <a routerLink="/admin/reports" class="btn btn-dark">Reports</a>
  </div>

  <!-- Statistics Cards -->
  <div class="row mb-4 text-center">

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Total Cars</h5>
          <h3 class="text-primary">{{ totalCars }}</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Total Users</h5>
          <h3 class="text-success">{{ totalUsers }}</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Total Bookings</h5>
          <h3 class="text-warning">{{ totalBookings }}</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Active Rentals</h5>
          <h3 class="text-danger">{{ activeRentals }}</h3>
        </div>
      </div>
    </div>

  </div>

  <!-- Charts Row -->
  <div class="row">

    <!-- Top Rented Cars Donut -->
    <div class="col-md-6 mb-3">
      <donut-chart
        [data]="topCarsData"
        [keys]="{ label: 'name', value: 'value' }"
        [title]="'Car Types Distribution'"
        [clickable]="true"
        [noDataText]="'No booking data available!'">
      </donut-chart>
    </div>

    <!-- Booking Status Pie -->
    <div class="col-md-6 mb-3">
      <pie-chart
        [data]="bookingStatusData"
        [keys]="{ label: 'name', value: 'value' }"
        [title]="'Booking Status Distribution'"
        [clickable]="true"
        [noDataText]="'No status data found!'">
      </pie-chart>
    </div>

  </div>

  <!-- Monthly Bookings Bar Chart -->
  <div class="mb-3">
    <bar-chart
      [data]="monthlyBookingData.data"
      [categoryField]="'name'"
      [valueField]="'value'"
      [title]="'Monthly Booking Trends'"
      [noDataText]="'No monthly data available!'">
    </bar-chart>
  </div>

</div>
