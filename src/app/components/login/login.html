

<!-- Main Login Card -->
<div class="container mt-5 d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm" style="max-width: 700px;">
    <div class="row g-0">

      <!-- Left Image -->
      <div class="col-md-4 d-flex align-items-center justify-content-center bg-light">
        <img src="/assets/Registration.png" class="img-fluid rounded-start p-3" alt="Login Image">
      </div>

      <!-- Form -->
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title text-center mb-4">Login</h5>

          <p class="text-center text-muted mb-4">
            Welcome back! Please login to your account.
          </p>

          <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">

            <!-- Email -->
            <div class="mb-3">
              <input type="email" class="form-control" name="email" [(ngModel)]="model.email" required placeholder="Enter your email">
              <div *ngIf="loginForm.submitted && !model.email" class="text-danger small mt-1">
                Email is required
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <input type="password" class="form-control" name="password" [(ngModel)]="model.password" required placeholder="Enter your password">
              <div *ngIf="loginForm.submitted && !model.password" class="text-danger small mt-1">
                Password is required
              </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="loginError" class="alert alert-danger py-1">
              {{ loginError }}
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="loading">
                {{ loading ? 'Logging in...' : 'Login' }}
              </button>
            </div>

            <!-- Registration Link -->
            <p class="text-center mt-3 text-muted">
              Don't have an account? <a routerLink="/registration">Register here</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
