<div class="container my-4">
  <h2 class="mb-3 text-center">Available Cars</h2>

  <div class="mb-3">
    <input type="text" class="form-control" placeholder="Search by name" [(ngModel)]="searchTerm" />
  </div>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div class="row">
    <div *ngFor="let car of cars | filterCar:searchTerm" class="col-md-4 mb-4">
      <div class="card h-100">
        <img [src]="car.imageUrl || 'https://via.placeholder.com/400x200'" 
             class="card-img-top" alt="{{car.carname}}" height="200" />
        <div class="card-body">
          <h5 class="card-title">{{ car.carname }}</h5>
          <p class="card-text">{{ car.description  }}</p>
          <p class="card-text"><strong>Type:</strong> {{ car.type || 'General' }}</p>
          <p class="card-text"><strong>Price:</strong> ${{ car.price }}</p>
          <p class="card-text">
            <span class="badge" [ngClass]="car.available ? 'bg-success' : 'bg-danger'">
              {{ car.available ? 'Available' : 'Not Available' }}
            </span>
          </p>
        </div>
        <div class="card-footer text-center">
          <!-- 🔹 Use Angular routerLink instead of click method -->
          <!-- <a 
            *ngIf="car.available" 
            [routerLink]="['/car', car.id]" 
            class="btn btn-primary">
            View Details
          </a> -->
          <a 
  [routerLink]="['/car', car.id]" 
  class="btn btn-primary" 
  [ngClass]="{'disabled btn-secondary': !car.available}"
  [attr.aria-disabled]="!car.available">
  View Details
</a>

          <button 
            *ngIf="!car.available" 
            class="btn btn-secondary" disabled>
            Not Available
          </button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && cars.length === 0" class="text-center">
    <p>No cars found.</p>
  </div>
</div>
